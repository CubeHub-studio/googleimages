name: Generate image SEO pages

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "scripts/generate_image_pages.py"
      - ".github/workflows/generate-image-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-image-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate generator
        run: python3 -m py_compile scripts/generate_image_pages.py
      - name: Generate image pages and sitemap
        run: |
          python3 scripts/generate_image_pages.py
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
      - name: Commit generated files
        run: |
          if [[ -n "$(git status --porcelain index.html image-pages sitemap.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html image-pages sitemap.xml
            git commit -m "Generate SEO pages for gallery images"
            git push
          else
            echo "Generated SEO files are already up to date."
          fi
